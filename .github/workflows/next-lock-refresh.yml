name: Temporary Next lockfile refresh
on:
  push:
    branches: [chore/next-lock-refresh-20261003]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
      - run: |
          sed -i 's/"next": "16.3.6"/"next": "16.3.8"/' apps/web/package.json
          sed -i 's/"eslint-config-next": "16.3.6"/"eslint-config-next": "16.3.8"/' apps/web/package.json
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: next-16-3-8-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
