name: Ops security

on:
  pull_request:
    paths:
      - ".github/workflows/ops-security.yml"
      - "infra/ops/**"
      - "infra/backup/**"
      - "infra/systemd/**"
      - "docs/operations/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-security.yml"
      - "infra/ops/**"
      - "infra/backup/**"
      - "infra/systemd/**"

permissions:
  contents: read

jobs:
  isolated-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -I infra/ops/install_webprobe_ops.py --check
      - run: python3 -m unittest discover -s infra/ops -p 'test_*.py' -v
